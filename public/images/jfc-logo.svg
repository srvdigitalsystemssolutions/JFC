<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Flame & Shield Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f2be54" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Crimson Outer Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="15" y="15" width="470" height="470" rx="90" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Inner Subtle Border -->
  <rect x="30" y="30" width="440" height="440" rx="75" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Central Glow Effect -->
  <circle cx="250" cy="210" r="130" fill="#f97316" opacity="0.12" filter="url(#glow)" />

  <!-- Shield Badge Outline -->
  <path d="M 250,70 L 370,120 C 370,250 250,330 250,330 C 250,330 130,250 130,120 Z" 
        fill="#1e293b" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Central Flame / Fire Icon representing BBQ & Grills -->
  <path d="M 250,110 C 275,160 300,185 285,225 C 275,250 255,260 250,260 C 245,260 225,250 215,225 C 200,185 225,160 250,110 Z" 
        fill="url(#flameGrad)" />
  <path d="M 250,165 C 262,190 270,205 262,225 C 257,238 247,243 250,243 C 253,243 243,238 238,225 C 230,205 238,190 250,165 Z" 
        fill="#fef08a" />

  <!-- Cutlery Silhouette (Fork & Knife crossing beneath flame) -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <!-- Fork left to right -->
    <line x1="180" y1="280" x2="320" y2="160" />
    <path d="M 320,160 L 328,154 M 315,155 L 323,149 M 325,165 L 333,159" />
    <!-- Spoon/Knife right to left -->
    <line x1="320" y1="280" x2="180" y2="160" />
    <ellipse cx="175" cy="155" rx="8" ry="12" transform="rotate(-40 175 155)" stroke-width="3" fill="#1e293b" />
  </g>

  <!-- Large Bold "JFC" Typography -->
  <text x="250" y="325" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Ubuntu', 'Arial Black', sans-serif" 
        font-size="68" 
        font-weight="900" 
        letter-spacing="4" 
        fill="url(#goldGrad)" 
        stroke="#0f172a" 
        stroke-width="3"
        filter="url(#glow)">JFC</text>

  <!-- "JOHNSON FOOD COURT" Ribbon / Banner -->
  <g transform="translate(0, 10)">
    <rect x="45" y="355" width="410" height="52" rx="14" fill="url(#ringGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="250" y="390" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Ubuntu', 'Arial Black', sans-serif" 
          font-size="24" 
          font-weight="900" 
          letter-spacing="3" 
          fill="#ffffff">JOHNSON FOOD COURT</text>
  </g>

  <!-- Location & Cuisine Subtitle -->
  <text x="250" y="445" 
        text-anchor="middle" 
        font-family="'Ubuntu', 'Arial', sans-serif" 
        font-size="13" 
        font-weight="700" 
        letter-spacing="3.5" 
        fill="#f2be54">VELLORE • OPEN-AIR DINING • MULTI-CUISINE</text>

  <!-- Little Stars -->
  <text x="75" y="445" text-anchor="middle" font-size="14" fill="#facc15">★</text>
  <text x="425" y="445" text-anchor="middle" font-size="14" fill="#facc15">★</text>
</svg>
